spring:
  application:
    name: forum-service

  datasource:
    url: jdbc:postgresql://localhost:5435/forum_db
    username: ${POSTGRES_USER:forum_user}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:db/changelog/changelog.yaml
    enabled: true
